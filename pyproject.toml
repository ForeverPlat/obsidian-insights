[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-insight"
version = "0.1.0"
dependencies = []

[tool.setuptools]
packages = ["database", "pipeline", "commands", "utils"]
py-modules = ["cli", "main"]

[tool.setuptools.package-dir]
"" = "."

[project.scripts]
vault-insight = "cli:cli"
